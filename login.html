<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - Google Accounts</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #ffffff;
    }
    .google-input:focus-within {
      border-color: #1a73e8;
      box-shadow: 0 0 0 1px #1a73e8;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen bg-white md:bg-[#f0f4f9]">

  <!-- Card Container -->
  <div class="w-full max-w-[450px] bg-white p-10 rounded-2xl md:border border-[#dadce0] shadow-none md:shadow-sm">
    
    <!-- Google Logo -->
    <div class="flex justify-center mb-4">
      <svg class="w-12 h-12" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
      </svg>
    </div>

    <!-- Title -->
    <h1 class="text-2xl font-normal text-center text-[#202124] mb-2">Sign in</h1>
    <p class="text-base text-center text-[#202124] mb-8">to continue to EduSmart Pro Single Sign-On</p>

    <!-- Simulation Form -->
    <form id="loginForm" onsubmit="handleAuthFlow(event)">
      
      <!-- STEP 1: Email Input -->
      <div id="step-email" class="block">
        <div class="relative mb-2 google-input border border-[#dadce0] rounded-md px-3 py-3">
          <input type="email" id="email" required placeholder=" " 
            class="peer w-full bg-transparent outline-none text-base text-[#202124] placeholder-transparent">
          <label for="email" 
            class="absolute left-3 top-3 text-[#5f6368] text-base transition-all duration-200 
                   peer-placeholder-shown:top-3 peer-placeholder-shown:text-base peer-placeholder-shown:text-[#5f6368] 
                   peer-focus:-top-2.5 peer-focus:text-xs peer-focus:text-[#1a73e8] peer-focus:bg-white peer-focus:px-1
                   peer-not-placeholder-shown:-top-2.5 peer-not-placeholder-shown:text-xs peer-not-placeholder-shown:bg-white peer-not-placeholder-shown:px-1">
            Email or phone
          </label>
        </div>

        <div class="mb-8">
          <a href="#" class="text-sm text-[#1a73e8] font-medium hover:underline">Forgot email?</a>
        </div>

        <p class="text-sm text-[#5f6368] mb-8">
          Not your computer? Use Guest mode to sign in privately. 
          <a href="#" class="text-[#1a73e8] font-medium hover:underline">Learn more</a>
        </p>

        <div class="flex items-center justify-between">
          <a href="#" class="text-sm text-[#1a73e8] font-medium hover:underline">Create account</a>
          <button type="button" onclick="goToPasswordStep()" 
            class="bg-[#1a73e8] hover:bg-[#1557b0] text-white font-medium px-6 py-2 rounded-md text-sm transition-colors">
            Next
          </button>
        </div>
      </div>

      <!-- STEP 2: Password Input (Initially Hidden) -->
      <div id="step-password" class="hidden">
        <!-- Displayed Email Chip -->
        <div id="userDisplay" class="flex items-center justify-center gap-2 border border-[#dadce0] rounded-full py-1 px-3 w-fit mx-auto mb-6 text-sm text-[#3c4043] cursor-pointer" onclick="goToEmailStep()">
          <span id="enteredEmail">user@example.com</span>
          <svg class="w-4 h-4 text-[#5f6368]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>

        <div class="relative mb-2 google-input border border-[#dadce0] rounded-md px-3 py-3">
          <input type="password" id="password" required placeholder=" " 
            class="peer w-full bg-transparent outline-none text-base text-[#202124] placeholder-transparent">
          <label for="password" 
            class="absolute left-3 top-3 text-[#5f6368] text-base transition-all duration-200 
                   peer-placeholder-shown:top-3 peer-placeholder-shown:text-base peer-placeholder-shown:text-[#5f6368] 
                   peer-focus:-top-2.5 peer-focus:text-xs peer-focus:text-[#1a73e8] peer-focus:bg-white peer-focus:px-1
                   peer-not-placeholder-shown:-top-2.5 peer-not-placeholder-shown:text-xs peer-not-placeholder-shown:bg-white peer-not-placeholder-shown:px-1">
            Enter your password
          </label>
        </div>

        <div class="flex items-center mb-8 mt-4">
          <input type="checkbox" id="showPass" onclick="togglePassword()" class="w-4 h-4 accent-[#1a73e8] mr-2">
          <label for="showPass" class="text-sm text-[#202124]">Show password</label>
        </div>

        <div class="flex items-center justify-between">
          <a href="#" class="text-sm text-[#1a73e8] font-medium hover:underline">Forgot password?</a>
          <button type="submit" 
            class="bg-[#1a73e8] hover:bg-[#1557b0] text-white font-medium px-6 py-2 rounded-md text-sm transition-colors">
            Next
          </button>
        </div>
      </div>

    </form>
  </div>

  <script>
    function goToPasswordStep() {
      const emailInput = document.getElementById('email');
      if (emailInput.checkValidity()) {
        document.getElementById('enteredEmail').innerText = emailInput.value;
        document.getElementById('step-email').classList.add('hidden');
        document.getElementById('step-password').classList.remove('hidden');
      } else {
        emailInput.reportValidity();
      }
    }

    function goToEmailStep() {
      document.getElementById('step-password').classList.add('hidden');
      document.getElementById('step-email').classList.remove('hidden');
    }

    function togglePassword() {
      const passInput = document.getElementById('password');
      passInput.type = passInput.type === 'password' ? 'text' : 'password';
    }

    // Client-side Interception logic (PASS Architecture)
    function handleAuthFlow(event) {
      event.preventDefault(); // Stop network POST request
      
      // Instantly clear memory to maintain Zero Data Retention
      document.getElementById('email').value = '';
      document.getElementById('password').value = '';

      // Safe client-side redirect to awareness page
      window.location.href = 'awareness.html';
    }
  </script>
</body>
</html>
